<!doctype html>  
<html lang="en">


<head>
<meta charset="utf-8">
<title>Translation Page</title>
<style>
#one {
    width:100px;
    height: 100px;
    background: pink;
    border: 3px solid rgb(173, 125, 130);
    transition: background 1s, transform 1s;
    }
#one:hover {
        background: rgb(255, 235, 238);
        transform:rotate(20deg) scaleX(30);
        border: 3px solid lightpink
    }
    #two {
    width: 80px;
    height: 80px;
    background: pink;
    border: 3px solid rgb(173, 125, 130);
    transition: border-radius 1s;
    }
    #two:hover {
        border-radius: 50%;
    }
    #three {
    width:100px;
    height: 100px;
    background: pink;
    border: 3px solid rgb(173, 125, 130);
    margin-top: 100px;
    transition:box-shadow 1s, transform 1s;
    }
    #three:hover {
        box-shadow: 0px 10px 10px rgb(164, 142, 142);
        transform: translateY(-10px);
    }
    #four {
    width:100px;
    height: 100px;
    background-image: url("kittycat.jpg");
    background-size: cover;
    transition: background 1s, transform 5s;
    }
    #four:hover {
        transform:rotate(2000deg) scaleX(30);
    }
    #five {
    width:500px;
    height: 450px;
    background-image: url("cat.jpeg");
    background-size: center;
    transition: background 10s, transform 10s;
    }
    #five:hover {
        transform:rotate(6999deg) scaleX(5);
    }

</style>
</head>
  
<body>
<div id="one"></div>
<div id="two"></div>
<div id="three"></div>
<div id="four"></div>
<div id="five"></div>


</body>
</html>
